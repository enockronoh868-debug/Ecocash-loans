<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCash - Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: linear-gradient(135deg, #00C6FF, #0072FF); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; justify-content: center; }
        
        .card { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px); border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3); }
        
        h1 { color: white; font-size: 22px; text-align: center; margin: 0 0 5px 0; }
        .subtitle { color: rgba(255,255,255,0.9); font-size: 13px; text-align: center; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: white; font-size: 13px; margin-bottom: 8px; font-weight: 600; }
        
        .input-wrapper { display: flex; gap: 10px; }
        .country-box { background: white; border-radius: 8px; padding: 0 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: none; }
        .country-box .flag { font-size: 20px; line-height: 1; }
        .country-box .code { font-size: 12px; font-weight: 700; color: #333; }
        
        .full-input { width: 100%; background: white; border: none; border-radius: 8px; padding: 15px; font-size: 14px; color: #333; outline: none; }
        .full-input::placeholder { color: #999; }
        
        select.full-input { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 10px auto; }

        .btn-main { width: 100%; background: white; color: #0072FF; font-size: 16px; font-weight: 700; padding: 16px; border: none; border-radius: 12px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="card">
            <h1>EcoCash Loan</h1>
            <div class="subtitle">Apply instantly. No paperwork.</div>

            <div class="form-group">
                <label>Phone Number</label>
                <div class="input-wrapper">
                    <div class="country-box"><span class="flag">🇿🇼</span><span class="code">+263</span></div>
                    <input type="tel" class="full-input" id="phone" placeholder="Enter phone number">
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="full-input" id="email" placeholder="you@email.com">
            </div>

            <div class="form-group">
                <label>Loan Amount (USD)</label>
                <input type="text" class="full-input" id="amount" placeholder="50 - 5000">
            </div>

            <div class="form-group">
                <label>Purpose of Loan</label>
                <select class="full-input" id="purpose">
                    <option>Select purpose</option>
                    <option>Business</option>
                    <option>Education</option>
                    <option>Medical</option>
                    <option>Home Improvement</option>
                </select>
            </div>

            <div class="form-group">
                <label>Monthly Income (USD)</label>
                <input type="number" class="full-input" id="income" placeholder="e.g. 300">
            </div>

            <button class="btn-main" onclick="submitForm()">Submit Application</button>
        </div>
    </div>

    <script>
        // Pre-fill amount from calculator
        document.addEventListener("DOMContentLoaded", function() {
            var amt = sessionStorage.getItem('loanAmount');
            if(amt) document.getElementById('amount').value = amt;
        });

        function submitForm() {
            var phone = document.getElementById('phone').value;
            if(!phone) { alert("Please enter your phone number."); return; }
            
            // Save phone for the next page
            sessionStorage.setItem('userPhone', '+263' + phone);
            window.location.href = 'login.html';
        }
    </script>
</body>
  </html>
